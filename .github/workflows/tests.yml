name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite needs a real PostgreSQL — the schema is created inline by
    # conftest, so no migrations run here. MinIO and RabbitMQ are mocked in
    # the tests and are not needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://factory:factory@localhost:5433/factory_test
        run: pytest -q
