services:
  postgres:
    image: postgres:16-alpine
    container_name: factory-postgres
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 3s
      retries: 5

  factory:
    build: .
    container_name: factory-of-code
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8585:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - /root/.ssh:/root/.ssh:ro
      - /root/.claude:/root/.claude:ro
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring:
    external: true
    name: obs_monitoring

volumes:
  pgdata:
