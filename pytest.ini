[pytest]
# The repository root has to be on sys.path for `from src...` to resolve.
#
# Without this the suite works when invoked as `python -m pytest` — which puts
# the working directory on sys.path — and fails with ModuleNotFoundError when
# invoked as plain `pytest`, because the console script does not. Encoding it
# here means the tests behave identically however they are started, instead of
# depending on the habit of whoever runs them.
pythonpath = .
testpaths = tests
